[package]
name = "sentinel-engine"
version = "1.0.0"
edition = "2021"
authors = ["Ozan Özdil"]
description = "Unified Cyber Security & Privacy Sentinel Hub for Omarchy Linux"

[lib]
name = "sentinel_engine"
path = "src/lib.rs"

[[bin]]
name = "sentinel-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
