name: "Rust CI"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        # The live network blackout test stays disabled (SENTINEL_DESTRUCTIVE_TESTS unset)
        run: cargo test --locked

  msrv:
    name: Build on minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"

      - name: Build
        run: cargo build --locked --all-targets

  packaging:
    name: QML, shell scripts & PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: |
          for i in 1 2 3; do
            pacman -Syu --noconfirm --needed git base-devel qt6-declarative shellcheck namcap && break
            sleep 5
          done

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: QML syntax (qmllint fails on parse errors)
        run: /usr/lib/qt6/bin/qmllint Panel.qml qml/*.qml qml/theme/*.qml

      - name: shellcheck
        run: |
          shellcheck --severity=warning sentinel-dashboard
          shellcheck --severity=warning -s bash omarchy-security-sentinel.install

      - name: PKGBUILD
        # makepkg refuses to run as root
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "makepkg --printsrcinfo" > /dev/null
          namcap PKGBUILD

